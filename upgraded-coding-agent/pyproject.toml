[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "upgraded-coding-agent"
version = "2.5.0"
description = "Autonomous Self-Healing Coding Agent featuring Authentic Intelligence, AST Security Guardrails, and HITL Review Gates"
authors = [{ name = "Principal AI Systems Engineer" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.40.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "flake8>=7.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
streamlit = [
    "streamlit>=1.35.0",
]
all = [
    "streamlit>=1.35.0",
    "openai>=1.25.0",
    "google-genai>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".pytest_cache"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.flake8]
max-line-length = 100
exclude = [".venv", ".git", "__pycache__", ".sandboxes"]
